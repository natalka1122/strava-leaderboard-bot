# Dev toolchain + tool config. Single source of truth for the Python packages
# baked into the devcontainer image (see the "Python tooling" step in
# .devcontainer/Dockerfile).
#
# This repo is not a distributable package, so there is deliberately no
# [project] table; only a PEP 735 dependency group. Runtime (app) deps live
# separately in app/requirements.txt.
#
# Refresh inside the container:
#   uv pip install --system --break-system-packages --group dev
#
# `uv` itself is bootstrapped with pip in the Dockerfile (chicken-and-egg), so
# it is not listed here.

[dependency-groups]
# Pinned with `==` on purpose. The lint gate is only meaningful if the tools
# behind it are reproducible: an unpinned rebuild once pulled a newer ruff/WPS
# and flipped the whole tree from green to ~200 findings with no code change.
# Bump a pin deliberately (and re-baseline below) rather than by rebuilding.
dev = [
    # pre-commit framework + the hooks declared in .pre-commit-config.yaml
    "pre-commit==4.7.0",
    "ruff==0.17.3",                     # formatting + fast lint
    "flake8==7.5.0",                    # host for the plugins below
    "flake8-pyproject==1.2.4",          # lets flake8 read [tool.flake8] from here
    "wemake-python-styleguide==1.8.1",  # WPS checks
    "dlint==0.17.0",                    # DUO checks
    "cohesion==1.2.0",                  # H601 module cohesion
    "vulture==2.16",                    # dead code
    "import-linter==2.15",

    # typing + tests
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-xdist==3.8.0",
]

# ---------------------------------------------------------------------------
# ruff — formatting and fast style/quality lint
# ---------------------------------------------------------------------------
# Rule set mirrors the wemake-services template, minus "I": import order is
# owned by isort below, so two import sorters can never fight over one file.
# wemake-python-styleguide is not a ruff plugin — it runs after ruff, as a
# separate flake8 pass (see [tool.flake8] and .pre-commit-config.yaml).
[tool.ruff]
line-length = 80
target-version = "py314"
output-format = "concise"
fix = true

# `app/` is a flat directory of modules, not a package. Declaring it as a
# source root is what makes ruff treat `config`, `strava_scraper`, ... as
# first-party (otherwise they are sorted with third-party imports).
# Same intent as mypy's `mypy_path` below.
src = ["app"]

# `preview` is OFF on purpose: preview rules/formatting change between ruff
# releases, which would churn the whole tree on every bump (e.g. preview
# rewrites `except (A, B)` to PEP 758's unparenthesized `except A, B`).

extend-exclude = [".pi", "leaderboard_output"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ASYNC",
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "COM",  # flake8-commas
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle
    "ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # pyflakes
    "FA",   # flake8-future-annotations
    "FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    "FURB", # refurb
    "G",    # flake8-logging-format
    # isort — ruff's own implementation replaces the standalone isort tool.
    # The old isort "wemake" profile only set layout knobs (multi_line_output,
    # include_trailing_comma, use_parentheses, line_length=80); `ruff format`
    # covers those, so ruff's isort owns ordering only and needs no options.
    "I",
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T100", # flake8-debugger
    "TRY",  # tryceratops
]

# COM812 fights the formatter (ruff says so itself): ruff format already
# normalises trailing commas, so the lint rule only creates conflicts.
ignore = ["COM812"]

[tool.ruff.lint.pydocstyle]
# pep257 picks D211 + D212, which are mutually exclusive with D203 + D213.
# Without this ruff warns about the incompatible pairs on every single run.
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests lean on literals, long test names, and assert-style helpers.
"tests/*.py" = ["D", "PLR2004", "S101"]

# --- Legacy baseline (ratchet) ---------------------------------------------
# app/ and tests/ predate the ruff + WPS gate and are not clean yet. Each entry
# names only the rules that file currently trips, so every other rule — and
# every new file — stays enforced. Shrink a list as a file is fixed; delete the
# entry once it is clean. The WPS half of the baseline lives in
# [tool.flake8].per-file-ignores below.
"app/bot.py" = ["D103", "D205", "D400", "DTZ005", "EXE001", "FBT001", "FBT002", "PTH103", "PTH118", "PTH202", "RUF001", "TRY400"]
"app/cookie_health_check.py" = ["D205", "E501", "PLR2004", "PLW0603", "PLW2901"]
"app/event_reminders.py" = ["C901", "D103", "D205", "D401", "E501", "FBT001", "FBT002", "FURB162", "PLR2004", "PTH103", "PTH105", "PTH110", "PTH112", "PTH118", "PTH120", "PTH123", "PTH208", "RUF001", "S311"]
"app/image_generator.py" = ["D103", "FBT001", "FBT002", "FBT003", "N806", "PLR0913", "PLR2004", "PTH100", "PTH118", "PTH120", "RUF001", "TRY300"]
"app/strava_scraper.py" = ["D103", "D205", "E501", "N806", "PLR2004", "S101", "TRY003", "TRY300"]
"app/telegram_client.py" = ["D205", "D401", "PLR2004", "PTH123", "TRY300", "TRY400"]
"tests/test_event_reminders.py" = ["E501", "N802", "PLC0415", "PT009", "PTH100", "PTH118", "PTH120", "PTH123"]
"tests/test_scraper.py" = ["PLC0415", "PT009", "PTH100", "PTH118", "PTH120"]

[tool.ruff.format]
# ruff format replaces black entirely — same role, one tool fewer.
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# flake8 (+ plugins) — wemake is enforced via `select = WPS`
# ---------------------------------------------------------------------------
# Docs require WPS to be selected explicitly; E99 keeps flake8's own syntax
# errors on. DUO/H601 re-enable the dlint and cohesion checks that `select=WPS`
# would otherwise switch off.
#
# NOTE: flake8-pyproject stringifies every value and hands it to flake8 as
# config-file text, so these must use flake8's native comma-separated syntax —
# TOML arrays/inline tables are NOT supported here.
[tool.flake8]
format = "wemake"
show-source = true
statistics = false
doctests = true
max-line-length = 80
select = "WPS,E99,DUO,H601"
extend-exclude = ".venv,.pi,node_modules,leaderboard_output"
# WPS432 = magic numbers; tests are nothing but magic numbers.
#
# --- Legacy baseline (ratchet) ---------------------------------------------
# Same idea as [tool.ruff.lint.per-file-ignores]: each file names only the WPS
# rules it currently trips, so everything else (and every new file) stays
# enforced. Shrink and delete entries as files get cleaned up. flake8-pyproject
# stringifies this whole value, hence flake8's native, newline-separated
# `path: CODES` syntax rather than TOML arrays.
# NOTE: no leading indentation and no `#` comments inside the value — TOML
# keeps it verbatim, flake8 matches patterns literally, and any non-`pattern:
# codes` line makes flake8 abort with "Expected per-file-ignores to be a
# mapping". Also, flake8 (unlike ruff) applies only the *most specific* matching
# pattern, not a union, so each test file repeats WPS432 instead of inheriting
# it from tests/*.py.
per-file-ignores = """
tests/*.py: WPS432
app/bot.py: WPS111,WPS210,WPS213,WPS231,WPS432,WPS453,WPS457
app/config.py: WPS111,WPS226,WPS407
app/cookie_health_check.py: WPS121,WPS122,WPS213,WPS231,WPS420,WPS430,WPS432,WPS504
app/event_reminders.py: DUO102,WPS110,WPS111,WPS202,WPS210,WPS221,WPS231,WPS237,WPS336,WPS407,WPS408,WPS430,WPS432
app/image_generator.py: WPS111,WPS204,WPS210,WPS211,WPS213,WPS221,WPS226,WPS229,WPS231,WPS237,WPS335,WPS407,WPS430,WPS432
app/leaderboard_gif.py: WPS110,WPS210,WPS213,WPS221,WPS226,WPS234,WPS237,WPS426,WPS432,WPS504
app/leaderboard_history.py: WPS210
app/strava_scraper.py: WPS110,WPS111,WPS210,WPS221,WPS226,WPS229,WPS231,WPS232,WPS336,WPS432,WPS505
app/telegram_client.py: WPS111,WPS229,WPS232,WPS432
tests/test_event_reminders.py: WPS432,H601,WPS110,WPS111,WPS114,WPS201,WPS210,WPS221,WPS226,WPS458,WPS515
tests/test_leaderboard_gif.py: WPS432,WPS202,WPS226
tests/test_leaderboard_history.py: WPS432,WPS111,WPS202,WPS218,WPS226,WPS336,WPS407,WPS441
tests/test_resilience.py: WPS432,WPS118,WPS430
tests/test_scraper.py: WPS432,H601,WPS111,WPS114,WPS221,WPS226,WPS338,WPS458
"""

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
# `mypy_path = "app"` is what makes the flat `app/` modules (`config`,
# `strava_scraper`, ...) resolve as first-party instead of third-party — the
# CLI equivalent of `PYTHONPATH=app`. Without it mypy reports 23 import errors.
#
# TODO: drop `ignore_missing_imports` by adding stub packages (`types-Pillow`,
# `types-requests`, ...) to the dev group, and turn on `strict` (currently 61
# errors) once the codebase is annotated.
[tool.mypy]
mypy_path = "app"
explicit_package_bases = true
ignore_missing_imports = true
