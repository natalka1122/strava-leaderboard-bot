name: Server Health Check

on:
  schedule:
    # Every 3 hours — matches the bot's cookie-check cadence
    - cron: "23 */3 * * *"
  workflow_dispatch: {}

jobs:
  health:
    name: Check stage + prod containers
    runs-on: ubuntu-latest
    # prod env accepts `main`-ref runs; stage env branch policy doesn't.
    # Both envs share one server + deploy user (see Goal.md), so one key
    # reaches both checkouts. If stage moves to its own server, split jobs
    # and allow `main` in the stage env branch policy.
    environment: prod
    steps:
      - name: Health check via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            for DIR in stage prod; do
              cd /opt/strava-leaderboard-bot/$DIR

              CID=$(docker compose ps -q strava-bot 2>/dev/null)
              [ -n "$CID" ] || { echo "❌ [$DIR] container missing"; exit 1; }

              STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CID")
              echo "[$DIR] container health: $STATUS"
              [ "$STATUS" = "healthy" ] || { echo "❌ [$DIR] container not healthy"; exit 1; }

              docker compose logs --since 3h 2>&1 | grep -qE "Traceback|non-JSON response" \
                && { echo "❌ [$DIR] crash or fetch degradation in recent logs"; exit 1; } \
                || echo "✅ [$DIR] no crash/degradation markers in logs"
            done