name: Server Health Check

on:
  schedule:
    # Every 3 hours — matches the bot's cookie-check cadence
    - cron: "23 */3 * * *"
  workflow_dispatch: {}

jobs:
  stage:
    name: stage container
    runs-on: ubuntu-latest
    # The schedule only ever runs on main, and the stage env's branch policy
    # rejects main — so borrow the prod environment there (both envs share one
    # server + deploy key). On develop, use the real stage environment.
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'stage' }}
    env:
      DIR: stage
    steps:
      - name: Check stage
        uses: appleboy/ssh-action@v1.2.2
        # Shared by both jobs via the YAML anchor on `with`.
        with: &check
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DIR
          script: |
            set -uo pipefail
            cd "/opt/strava-leaderboard-bot/$DIR" \
              || { echo "::error::[$DIR] checkout missing"; exit 1; }

            CID=$(docker compose ps -q strava-bot 2>/dev/null)
            if [ -z "$CID" ]; then
              echo "::error::[$DIR] container missing"
              exit 1
            fi

            STATUS=$(docker inspect --format \
              '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$CID")
            echo "[$DIR] container health: ${STATUS:-none}"

            # Capture the last 3h of logs once; print them in full on failure
            # so the traceback lands in the Actions log, not just a marker.
            LOGS=$(docker compose logs --since 3h 2>&1 || true)
            MARKERS=$(printf '%s\n' "$LOGS" \
              | grep -nE "Traceback|non-JSON response" || true)

            FAIL=0
            if [ "$STATUS" != "healthy" ]; then
              echo "::error::[$DIR] container not healthy: $STATUS"
              FAIL=1
            fi
            if [ -n "$MARKERS" ]; then
              echo "::error::[$DIR] crash markers in last 3h of logs"
              echo "───── $DIR logs (last 3h) ─────"
              printf '%s\n' "$LOGS"
              echo "───── end $DIR logs ─────"
              FAIL=1
            fi

            if [ "$FAIL" -eq 0 ]; then
              echo "✅ [$DIR] healthy, no crash markers"
            fi
            exit "$FAIL"

  prod:
    name: prod container
    runs-on: ubuntu-latest
    # prod env permits main only — and prod must never be checked from a
    # develop dispatch, so gate the whole job to main.
    environment: prod
    if: github.ref == 'refs/heads/main'
    env:
      DIR: prod
    steps:
      - name: Check prod
        uses: appleboy/ssh-action@v1.2.2
        with: *check
