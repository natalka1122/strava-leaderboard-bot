name: Lint

# Why this exists: every pre-commit hook is `language: system` and there was no
# CI job running them. The gate therefore rotted invisibly — an unpinned
# devcontainer rebuild pulled a newer ruff/WPS and the hooks went red repo-wide
# with nobody noticing until a commit was blocked. This job runs exactly what a
# developer runs, on the pinned toolchain, so drift is caught in CI instead.
on:
  push:
    branches: [develop, main]
  pull_request:

# Least privilege: pre-commit only needs to read the checkout.
permissions:
  contents: read

# Supersede an in-flight run when the same ref is pushed again.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (lint, format, types)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        # v5.0.0 - SHA-pinned to satisfy zizmor unpinned-uses
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Python
        # v6.0.0 - SHA-pinned; v6 is the first line that knows Python 3.14
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install pinned dev toolchain
        # Same command the devcontainer uses. Versions come from the pinned
        # [dependency-groups].dev in pyproject.toml, never from this file.
        run: uv pip install --system --break-system-packages --group dev

      - name: Run pre-commit
        # --show-diff-on-failure prints the offending diff (e.g. ruff format's)
        # straight into the Actions log, so a failure is self-explanatory.
        run: pre-commit run --all-files --show-diff-on-failure
